name: daily-intel

# 每天 09:30（北京时间）生成一份简报，贴进「本周情报」issue。
# 只读仓库、只写 issue，不改文件、不提 PR，所以不给 contents: write。
#
# 以前是一天开一个 issue：六天六个 issue，全是 open、零评论，没人看。
# 现在按周开一个，每天往同一个 issue 追加一条评论，看完就可以关。

on:
  schedule:
    # UTC 01:30 = 北京 09:30。
    # GitHub 的 schedule 不保证准点，排队高峰会晚几小时（实测 11-15 那次
    # 是北京 16:16 才跑），属正常现象，不是失败。
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-intel
  cancel-in-progress: false

jobs:
  plan:
    name: 生成今天的情报
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成简报（检索词 + 库里现有卡片对照）
        run: |
          python scripts/harvest.py stats
          python scripts/intel.py > report.md
          echo "----- report.md -----"
          cat report.md

      - name: 确保标签存在
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create daily-intel \
            --color F59E0B \
            --description "每日情报：待转成情境卡" 2>/dev/null || true

      - name: 开本周 issue（已有就追加评论）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          DAY="$(date -u +%F)"
          WEEK="$(date -u +%G-W%V)"
          TITLE="今日情报 ${WEEK}"
          CREATED="$(date -u +%FT%TZ)"

          {
            echo "## ${DAY}"
            echo
            echo "<!-- intel:${DAY} -->"
            echo
            cat report.md
            echo
            echo "## 怎么算做完"
            echo
            echo "- 挑 2 到 3 条搜一轮，读没看过的；只提炼情境结构，不抄原句"
            echo "- 每个候选一行 JSON，字段见 [research/README.md](${REPO_URL}/blob/main/research/README.md)"
            echo "- 跑 \`python scripts/harvest.py check\`，0 错误才算完"
            echo "- 值得补卡的写 \`verdict: keep\`；和库里重复的写 \`dup\` 并填 \`dup_of\`；劝分、玩梗、带隐私的写 \`reject\` 并填 \`reject_reason\`"
            echo
            echo "## 口径提醒"
            echo
            echo "- 评论区大量内容是「劝分」，方向和本仓库相反，看到直接 reject"
            echo "- 不记录任何人的身份信息，不给账号、昵称、学校、公司名"
            echo "- 同类缺口出现三次以上，才值得单独补一张卡"
          } > body.md

          EXIST="$(gh issue list --label daily-intel --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${EXIST}" ]; then
            # 同一天重复跑（手动触发两次）就不要再贴一遍。
            # 标记在正文里（开 issue 那天）或某条评论里（后面几天），两处都要查。
            if gh issue view "${EXIST}" --json body,comments \
                 --jq '.body + "\n" + ([.comments[].body] | join("\n"))' \
                 | grep -q "intel:${DAY}"; then
              echo "今天的简报已经在 #${EXIST} 里了，跳过"
              exit 0
            fi
            echo "追加到本周 issue #${EXIST}"
            gh issue comment "${EXIST}" --body-file body.md
          else
            gh issue create --title "${TITLE}" --body-file body.md --label daily-intel
          fi